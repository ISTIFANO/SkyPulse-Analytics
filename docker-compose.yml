services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: aerostream_user
      POSTGRES_PASSWORD: aerostream_pass
      POSTGRES_DB: aerostream
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d/

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  airflow:
    image: apache/airflow:2.8.3
    container_name: airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: skypulse_secret_key_123
    volumes:
      - ./dags:/opt/airflow/dags
      - ./streaming:/opt/airflow/streaming
      - airflow_data:/opt/airflow
    ports:
      - "8085:8080"
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true && airflow webserver"
    depends_on:
      - postgres

  app:
    build: .
    container_name: sky_app
    ports:
      - "8501:8501"
      - "9000:9000"
    volumes:
      - .:/app
    command: bash -c "uvicorn fake_api.main:app --host 0.0.0.0 --port 9000 & streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      - postgres

volumes:
  pgdata:
  airflow_data:
